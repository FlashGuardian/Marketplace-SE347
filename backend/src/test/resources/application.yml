spring:
  datasource:
    url: jdbc:h2:mem:marketplace;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-secret-key-with-at-least-64-characters-for-hmac-sha256-signing
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
